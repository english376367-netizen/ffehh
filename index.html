<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise 3 – Sentence Rewrite</title>
<style>
:root{--blue:#1769aa;--green:#187744;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:#f2f6fa;color:#182635;font:16px/1.55 Arial,sans-serif;user-select:none;-webkit-user-select:none}
header{background:linear-gradient(120deg,#0e578e,#3188c7);color:white;text-align:center;padding:22px 14px}
h1{font-size:clamp(21px,4vw,30px);margin:0 0 6px}header p{margin:0}
main{max-width:950px;margin:20px auto;padding:0 12px}.panel{background:white;border-radius:14px;padding:18px;box-shadow:0 4px 16px #173b5814;margin-bottom:16px}
#gate{max-width:440px;margin:35px auto;text-align:center}input[type=password],textarea{width:100%;border:1px solid #b9c8d6;border-radius:9px;padding:12px;font:inherit;user-select:text;-webkit-user-select:text}
button{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:white;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#607487}.hintbtn{background:#8654a6}.reset{background:#b54742}.check{background:#16804a}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar button{font-size:14px}
#questionNav{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
#questionNav button{background:#e3edf7;color:#194b72;padding:7px 11px}#questionNav button.current{background:var(--blue);color:white}#questionNav button.checked{background:#d9f2e3;color:#17653a}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#617386;font-size:14px}
.prompt{font-size:19px;font-weight:700;margin:14px 0 8px}.original{background:#f0f7ff;border-left:4px solid #3188c7;padding:12px;border-radius:8px;margin:12px 0}
.target{color:#4b5d6f;font-size:14px}.hintbox,.feedback{padding:12px;border-radius:9px;margin-top:12px;white-space:pre-wrap}.hintbox{background:#fff7d9;border-left:4px solid #e4b52e}.good{background:#e9f7ee;border-left:4px solid var(--green)}.bad{background:#fff0ef;border-left:4px solid var(--red)}
textarea{min-height:90px;resize:vertical}.score{font-weight:700;color:#104c7b}.note{font-size:13px;color:#607386}
@media(max-width:600px){.panel{padding:13px}.prompt{font-size:17px}.toolbar button{flex:1}}
</style></head>
<body>
<header><h1>Exercise 3 – Sentence Rewrite</h1><p>Rewrite the sentences without changing the meaning</p></header>
<main>
<section id="gate" class="panel"><h2>Enter password</h2><p>Nhập mật khẩu để bắt đầu làm bài.</p><input id="pw" type="password" placeholder="Password" autocomplete="off"><div style="margin-top:12px"><button onclick="unlock()">Start</button></div><p id="gateMsg" class="note"></p></section>
<div id="app" style="display:none">
<section class="panel"><div class="meta"><span><b>Instructions:</b> Viết lại câu hoàn chỉnh. Mỗi câu chỉ được chấm một lần, trừ khi dùng Reset.</span><span class="score" id="score">Score: 0 / 14</span></div><div id="questionNav"></div></section>
<section class="panel" id="work"></section></div></main>
<script>
const qs=[
{src:"I find dancing interesting.",lead:"I think that ...",answers:["i think that dancing is interesting"],display:"I think that dancing is interesting.",hint:"Use: I think that + subject + be + adjective.",grammar:"Cấu trúc “find + V-ing + adjective” có thể viết lại thành “think that + S + be + adjective”.",vi:"Tôi thấy việc nhảy múa thú vị. → Tôi nghĩ rằng nhảy múa rất thú vị."},
{src:"There are four people in my family.",lead:"My family ...",answers:["my family has four people"],display:"My family has four people.",hint:"Change “There are + number + people in ...” to “... has + number + people”.",grammar:"Dùng “My family has …” để diễn đạt gia đình có bao nhiêu người.",vi:"Có bốn người trong gia đình tôi. → Gia đình tôi có bốn người."},
{src:"My father doesn’t like listening to music.",lead:"My father hates ...",answers:["my father hates listening to music"],display:"My father hates listening to music.",hint:"Use: hate + V-ing.",grammar:"“Doesn’t like + V-ing” có thể đổi thành “hate + V-ing” theo đáp án mẫu.",vi:"Bố tôi không thích nghe nhạc. → Bố tôi ghét nghe nhạc."},
{src:"My mother rides to work every day.",lead:"My mother goes ...",answers:["my mother goes to work by bike every day","my mother goes to work by bicycle every day"],display:"My mother goes to work by bike/bicycle every day.",hint:"Use: go to work by bike/bicycle.",grammar:"“Ride to work” có thể diễn đạt bằng “go to work by bike/bicycle”. Lưu ý câu gốc là “to work”, không phải “to school”.",vi:"Mẹ tôi đi làm bằng xe đạp mỗi ngày."},
{src:"I like watching TV best.",lead:"My favourite hobby ...",answers:["my favourite hobby is watching tv","my favorite hobby is watching tv"],display:"My favourite hobby is watching TV.",hint:"Use: My favourite hobby + be + V-ing.",grammar:"“Like doing something best” có thể đổi thành “My favourite hobby is doing something”.",vi:"Tôi thích xem TV nhất. → Sở thích yêu thích nhất của tôi là xem TV."},
{src:"I find collecting glass bottles interesting.",lead:"My hobby ...",answers:["my hobby is collecting glass bottles"],display:"My hobby is collecting glass bottles.",hint:"Use: My hobby is + V-ing.",grammar:"Cấu trúc “I find … interesting” có thể viết lại bằng “My hobby is …” theo câu đã cho.",vi:"Tôi thấy việc sưu tầm chai thủy tinh thú vị. → Sở thích của tôi là sưu tầm chai thủy tinh."},
{src:"Van’s brother usually goes to work by motorbike.",lead:"Van’s brother usually rides ...",answers:["van's brother usually rides a motorbike to work","vans brother usually rides a motorbike to work"],display:"Van’s brother usually rides a motorbike to work.",hint:"Use: ride a motorbike to work.",grammar:"“Go to work by motorbike” tương đương với “ride a motorbike to work”.",vi:"Anh/em trai của Vân thường đi làm bằng xe máy."},
{src:"Linh finds playing boarding games boring.",lead:"Linh doesn’t like ...",answers:["linh doesn't like playing boarding games","linh doesn't like playing board games"],display:"Linh doesn’t like playing board games.",hint:"Use: doesn’t like + V-ing. The usual phrase is “board games”.",grammar:"“Finds … boring” có thể viết lại thành “doesn’t like …”. Sau “like” dùng V-ing. Cụm từ chuẩn thường là “board games” (trò chơi bàn cờ/board game).",vi:"Linh thấy chơi trò chơi bàn cờ nhàm chán. → Linh không thích chơi trò chơi bàn cờ."},
{src:"My sister enjoys arranging flowers. (interesting)",lead:"My sister finds ...",answers:["my sister finds arranging flowers interesting"],display:"My sister finds arranging flowers interesting.",hint:"Use: find + object/activity + adjective.",grammar:"Cấu trúc “enjoys V-ing” được viết lại theo từ gợi ý “interesting”: “finds + V-ing + interesting”.",vi:"Chị/em gái tôi thích cắm hoa. → Chị/em gái tôi thấy việc cắm hoa thú vị."},
{src:"My father likes doing gardening at the weekend.",lead:"My father enjoys ...",answers:["my father enjoys doing gardening at the weekend","my father enjoys gardening at the weekend"],display:"My father enjoys gardening at the weekend.",hint:"Use: enjoy + V-ing. “Gardening” is the natural expression.",grammar:"Sau “enjoy” dùng V-ing. Cách nói tự nhiên hơn là “enjoys gardening”.",vi:"Bố tôi thích làm vườn vào cuối tuần."},
{src:"I think that ice-skating is difficult.",lead:"I find ...",answers:["i find ice skating difficult","i find ice-skating difficult"],display:"I find ice-skating difficult.",hint:"Use: find + noun/V-ing + adjective.",grammar:"“I think that ice-skating is difficult” có thể đổi thành “I find ice-skating difficult”.",vi:"Tôi nghĩ trượt băng rất khó. → Tôi thấy trượt băng khó."},
{src:"My sister loves talking to her friends in her free time.",lead:"My sister enjoys ...",answers:["my sister enjoys talking to her friends in her free time"],display:"My sister enjoys talking to her friends in her free time.",hint:"Use: enjoy + V-ing. “Love” and “enjoy” can express liking an activity.",grammar:"“Loves talking” có thể đổi thành “enjoys talking”. Sau “enjoy” dùng V-ing.",vi:"Chị/em gái tôi thích nói chuyện với bạn bè vào thời gian rảnh."},
{src:"My uncle wants to keep fit, so he plays tennis three times a week.",lead:"My uncle plays tennis ...",answers:["my uncle plays tennis three times a week to keep fit"],display:"My uncle plays tennis three times a week to keep fit.",hint:"Use: frequency phrase + to + verb (purpose).",grammar:"Đưa cụm chỉ tần suất “three times a week” theo sau “plays tennis”, rồi dùng “to keep fit” để chỉ mục đích.",vi:"Chú/bác/cậu tôi muốn giữ dáng nên chơi quần vợt ba lần một tuần. → Chú/bác/cậu tôi chơi quần vợt ba lần một tuần để giữ dáng."},
{src:"My mum hates playing basketball.",lead:"My mum doesn’t like ...",answers:["my mum doesn't like playing basketball"],display:"My mum doesn’t like playing basketball.",hint:"Use: doesn’t like + V-ing.",grammar:"“Hates + V-ing” có thể đổi thành “doesn’t like + V-ing”.",vi:"Mẹ tôi ghét chơi bóng rổ. → Mẹ tôi không thích chơi bóng rổ."}
];
let current=0,answers=Array(qs.length).fill(''),checked=Array(qs.length).fill(false),hints=Array(qs.length).fill(false);
function unlock(){if(document.getElementById('pw').value==='367'){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';render()}else document.getElementById('gateMsg').textContent='Incorrect password. Try again.'}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
function render(){
document.getElementById('questionNav').innerHTML=qs.map((q,i)=>`<button onclick="go(${i})" class="${i===current?'current ':''}${checked[i]?'checked':''}">${i+1}</button>`).join('');
const q=qs[current];
document.getElementById('work').innerHTML=`<div class="meta"><span>Question ${current+1} of ${qs.length}</span><span>${checked[current]?'Submitted — locked':'One attempt only'}</span></div>
<div class="original"><div class="target">Original sentence</div><div class="prompt">${q.src}</div><div class="target">Rewrite beginning with:</div><div class="prompt">${q.lead}</div></div>
<label for="answer"><b>Your answer</b></label><textarea id="answer" placeholder="Type the complete sentence here..." ${checked[current]?'disabled':''}>${esc(answers[current])}</textarea>
<div class="toolbar" style="margin-top:12px"><button class="hintbtn" onclick="hint()" ${hints[current]||checked[current]?'disabled':''}>HINT</button><button class="check" onclick="check()" ${checked[current]?'disabled':''}>Check answer</button><button class="reset" onclick="resetOne()">Reset this question</button></div>
${hints[current]?`<div class="hintbox"><b>Hint:</b> ${q.hint}</div>`:''}${checked[current]?feedback(q):''}
<div class="toolbar" style="margin-top:18px"><button class="secondary" onclick="prev()" ${current===0?'disabled':''}>Previous</button><button onclick="next()" ${current===qs.length-1?'disabled':''}>Next</button></div><p class="note">Chọn số câu phía trên để chuyển trực tiếp. Reset chỉ xóa câu hiện tại và điểm của câu đó.</p>`;
document.getElementById('score').textContent=`Score: ${getScore()} / ${qs.length}`;
document.querySelectorAll('#questionNav button').forEach((b,i)=>{b.classList.toggle('current',i===current);b.classList.toggle('checked',checked[i])});
const ta=document.getElementById('answer');if(ta&&!checked[current])ta.addEventListener('input',e=>answers[current]=e.target.value);
}
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function norm(x){return String(x).toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim()}
function feedback(q){let ok=q.answers.some(a=>norm(a)===norm(answers[current]));return `<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✓ Correct!':'✗ Not quite. Compare with the model answer.'}</b><b>Đáp án mẫu:</b> ${esc(q.display)}<br><b>Giải thích cấu trúc:</b> ${esc(q.grammar)}<br><b>Nghĩa tiếng Việt:</b> ${esc(q.vi)}</div>`}
function check(){if(checked[current])return;let v=document.getElementById('answer').value.trim();if(!v){alert('Please type your answer first.');return}answers[current]=v;checked[current]=true;render()}
function hint(){hints[current]=true;render()}function go(i){current=i;render()}function next(){if(current<qs.length-1){current++;render()}}function prev(){if(current>0){current--;render()}}
function resetOne(){answers[current]='';checked[current]=false;hints[current]=false;render()}
function getScore(){return checked.reduce((sum,v,i)=>sum+(v&&qs[i].answers.some(a=>norm(a)===norm(answers[i]))?1:0),0)}
document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('cut',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['c','x','a','s','u'].includes(e.key.toLowerCase()))e.preventDefault()});
</script></body></html>
